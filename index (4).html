<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087ca7">
<title>Doctor to Doctor | تجمع الحدود الشمالية الصحي</title>
<style>
*{box-sizing:border-box}:root{--blue:#087ca7;--blue2:#11a5d2;--ink:#183747;--muted:#6c7e87;--bg:#f4f8fa;--green:#15885c;--line:#dce8ed}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(145deg,#087ca7,#19a9cf);color:white;padding:22px 16px 42px;border-radius:0 0 28px 28px}
.head{max-width:860px;margin:auto;text-align:center}
.logo-wrap{display:inline-flex;background:white;border-radius:24px;padding:8px;box-shadow:0 8px 25px #075b7830}
.logo-wrap img{display:block;width:min(58vw,220px);height:145px;object-fit:contain}
h1{font-size:29px;margin:13px 0 3px}.tag{font-size:14px;opacity:.95}
main{max-width:860px;margin:-22px auto 0;padding:0 14px 30px}
.panel,.card{background:white;border:1px solid var(--line);box-shadow:0 6px 22px #234a5b12}
.panel{border-radius:20px;padding:14px}
.search{width:100%;padding:14px;border:1px solid #cfe0e7;border-radius:13px;font-size:16px;outline:none}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
select{width:100%;padding:12px;border:1px solid #cfe0e7;border-radius:12px;background:white;font-size:14px}
.chips{display:flex;gap:8px;overflow:auto;padding:11px 0 1px}
.chip{border:0;padding:9px 13px;border-radius:999px;white-space:nowrap;background:#eaf3f7;color:#315767;font-weight:700}
.chip.active{background:var(--blue);color:white}
.bar{display:flex;align-items:center;justify-content:space-between;margin:19px 2px 8px}
.count{font-size:13px;color:var(--muted)}
.card{border-radius:18px;padding:15px;margin:10px 0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-size:18px;font-weight:800}.meta{font-size:13px;color:var(--muted);line-height:1.8;margin-top:4px}
.status{font-size:12px;font-weight:700;padding:7px 9px;border-radius:999px;white-space:nowrap}
.on{background:#dff5e9;color:#12633f}.available{background:#e2f4fb;color:#166886}.off{background:#eef2f4;color:#687a83}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:0;border-radius:12px;padding:11px;text-align:center;text-decoration:none;font-size:14px;font-weight:700}
.call{background:var(--green);color:white}.details{background:#e9f4f8;color:#17617a}
.notice{margin-top:16px;padding:12px;border-radius:14px;background:#fff8df;color:#6f5a0c;font-size:12px;line-height:1.7}
.empty{display:none;text-align:center;padding:35px;color:var(--muted)}
footer{text-align:center;color:#84959d;font-size:11px;padding:18px}
.sheet{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end;z-index:5}
.box{background:white;width:100%;border-radius:25px 25px 0 0;padding:20px;max-height:75vh;overflow:auto}
.close{width:100%;border:0;border-radius:12px;padding:12px;margin-top:12px}
@media(max-width:560px){.filters{grid-template-columns:1fr}.logo-wrap img{height:125px}}
</style>
</head>
<body>

<div class="bar"><strong>دليل الأطباء</strong><span class="count" id="count"></span></div>

<footer>Doctor to Doctor • Prototype 02 • 2026</footer>
</main>
