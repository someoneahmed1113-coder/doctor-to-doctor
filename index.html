<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087ca7">
<title>Doctor to Doctor | تجمع الحدود الشمالية الصحي</title>

<style>
*{box-sizing:border-box}
:root{
  --primary:#0B6F8E;
  --primary-dark:#07546D;
  --primary-soft:#EAF6FA;
  --accent:#18A7C8;
  --ink:#163241;
  --muted:#6F8590;
  --bg:#F4F8FA;
  --surface:#FFFFFF;
  --line:#DCE8ED;
  --green:#12805C;
  --green-soft:#E5F5EE;
  --blue-soft:#E7F3F8;
  --gray-soft:#F1F4F6;
  --shadow:0 10px 30px rgba(20,63,79,.08);
}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at top right,rgba(24,167,200,.08),transparent 34%),
    var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#07546D 0%,#0B6F8E 56%,#18A7C8 100%);
  color:white;
  padding:28px 18px 62px;
  border-radius:0 0 34px 34px;
}
header:before,
header:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.07);
}
header:before{width:190px;height:190px;top:-90px;left:-55px}
header:after{width:250px;height:250px;right:-120px;bottom:-145px}
.head{
  max-width:920px;
  margin:auto;
  text-align:center;
  position:relative;
  z-index:1;
}
.logo-wrap{
  width:100%;
  max-width:250px;
  margin:auto;
  background:white;
  border-radius:22px;
  padding:12px 18px;
  box-shadow:0 14px 34px rgba(0,40,55,.18);
}
.logo-wrap img{
  display:block;
  width:100%;
  height:112px;
  object-fit:contain;
}
h1{
  margin:17px 0 5px;
  font-size:31px;
  line-height:1.1;
  letter-spacing:.2px;
}
.tag{
  font-size:14px;
  opacity:.93;
  line-height:1.7;
}
main{
  max-width:920px;
  margin:-34px auto 0;
  padding:0 14px 34px;
  position:relative;
  z-index:2;
}
.panel{
  background:rgba(255,255,255,.98);
  border:1px solid rgba(220,232,237,.95);
  border-radius:22px;
  padding:15px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(8px);
}
.search{
  width:100%;
  padding:15px 16px;
  border:1px solid #CFE0E7;
  border-radius:14px;
  font-size:16px;
  background:#FAFCFD;
  color:var(--ink);
  outline:none;
  transition:.2s ease;
}
.search:focus{
  border-color:var(--accent);
  background:white;
  box-shadow:0 0 0 4px rgba(24,167,200,.10);
}
.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}
select{
  width:100%;
  padding:13px 12px;
  border:1px solid #CFE0E7;
  border-radius:13px;
  background:white;
  color:var(--ink);
  font-size:14px;
  outline:none;
}
.chips{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:12px 0 1px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:0;
  padding:10px 14px;
  border-radius:999px;
  white-space:nowrap;
  background:#EEF4F6;
  color:#315767;
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
}
.chip:hover{transform:translateY(-1px)}
.chip.active{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:white;
  box-shadow:0 6px 14px rgba(11,111,142,.20);
}
.bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:22px 2px 10px;
}
.bar strong{
  font-size:17px;
  letter-spacing:.1px;
}
.count{
  font-size:12px;
  color:var(--muted);
  background:white;
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:999px;
}
.card{
  position:relative;
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px;
  margin:11px 0;
  box-shadow:0 6px 20px rgba(20,63,79,.055);
  transition:.2s ease;
}
.card:before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:4px;
  height:100%;
  background:#D8E2E7;
}
.card-on:before{background:var(--green)}
.card-available:before{background:var(--accent)}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 26px rgba(20,63,79,.09);
}
.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}
.name{
  font-size:18px;
  font-weight:800;
  line-height:1.45;
}
.meta{
  font-size:13px;
  color:var(--muted);
  line-height:1.9;
  margin-top:6px;
}
.status{
  position:relative;
  font-size:12px;
  font-weight:800;
  padding:8px 11px 8px 12px;
  border-radius:999px;
  white-space:nowrap;
}
.status:before{
  content:"";
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  margin-left:6px;
  vertical-align:1px;
  background:currentColor;
}
.on{background:var(--green-soft);color:#116642}
.available{background:var(--blue-soft);color:#17647E}
.off{background:var(--gray-soft);color:#73828A}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:9px;
  margin-top:14px;
}
.btn{
  border:0;
  border-radius:12px;
  padding:12px;
  text-align:center;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}
.call{
  background:linear-gradient(135deg,#117754,#159567);
  color:white;
  box-shadow:0 6px 14px rgba(18,128,92,.16);
}
.whatsapp{
  background:linear-gradient(135deg,#1F9D68,#25B875);
  color:white;
  box-shadow:0 6px 14px rgba(31,157,104,.15);
}
.details{
  background:var(--primary-soft);
  color:var(--primary-dark);
}
.notice{
  margin-top:18px;
  padding:14px;
  border:1px solid #F0E2AE;
  border-radius:16px;
  background:#FFF9E8;
  color:#6D5B1F;
  font-size:12px;
  line-height:1.8;
}
.empty{
  display:none;
  text-align:center;
  padding:40px 10px;
  color:var(--muted);
}
footer{
  text-align:center;
  color:#8B9BA3;
  font-size:11px;
  padding:20px 8px 8px;
}
.sheet{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(7,28,38,.48);
  align-items:flex-end;
  z-index:20;
  backdrop-filter:blur(3px);
}
.box{
  background:white;
  width:100%;
  max-height:78vh;
  overflow:auto;
  border-radius:28px 28px 0 0;
  padding:22px;
  box-shadow:0 -18px 50px rgba(0,0,0,.14);
}
.box h2{margin:0 0 16px;font-size:22px}
.box p{
  margin:8px 0;
  padding:10px 12px;
  background:#F7FAFB;
  border-radius:12px;
  color:#35505D;
}
.close{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  margin-top:12px;
  background:#EEF3F5;
  color:#35505D;
  font-weight:800;
}
@media(max-width:560px){
  header{padding:22px 14px 54px;border-radius:0 0 28px 28px}
  .logo-wrap{max-width:220px;padding:9px 14px}
  .logo-wrap img{height:96px}
  h1{font-size:27px}
  main{margin-top:-30px}
  .filters{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr 1fr}
  .actions .details{grid-column:1/-1}
}
</style>

</head>

<footer>Doctor to Doctor • Prototype 02 • 2026</footer>
</main>
