<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#113b63">
<title>Doctor to Doctor</title>
<style>
*{box-sizing:border-box}
:root{--navy:#113b63;--blue:#1d5f8f;--bg:#f4f7fb;--text:#19364f;--muted:#718493;--green:#168a54;--amber:#b87500}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:24px 16px 36px;border-radius:0 0 26px 26px}
.hero-inner{max-width:820px;margin:auto}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:48px;height:48px;background:#fff;color:var(--navy);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800}
h1{font-size:27px;margin:0} .sub{opacity:.9;margin-top:4px;font-size:14px}
.wrap{max-width:820px;margin:auto;padding:0 14px 24px}
.panel{background:#fff;margin-top:-20px;border-radius:18px;padding:14px;box-shadow:0 8px 22px rgba(20,50,80,.12)}
input,select{width:100%;padding:13px;border:1px solid #d8e2eb;border-radius:12px;font-size:15px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.chips{display:flex;gap:8px;overflow:auto;margin-top:10px}
.chip{border:0;padding:9px 12px;border-radius:999px;white-space:nowrap;background:#edf3f7;color:#35536b}
.chip.active{background:var(--navy);color:#fff}
.headrow{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}
.count{font-size:13px;color:var(--muted)}
.card{background:#fff;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 3px 14px rgba(25,54,79,.06)}
.top{display:flex;justify-content:space-between;gap:10px}
.name{font-size:18px;font-weight:700}
.meta{font-size:13.5px;color:var(--muted);line-height:1.7;margin-top:5px}
.status{font-size:12px;border-radius:999px;padding:7px 10px;height:max-content;white-space:nowrap}
.on{background:#dff5e8;color:#116d41} .avail{background:#e8f1fb;color:#235f8d} .off{background:#f0f1f3;color:#6d7780}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:0;border-radius:11px;padding:11px;text-align:center;text-decoration:none;font-size:14px}
.call{background:var(--green);color:white} .details{background:#eaf2f7;color:var(--navy)}
.notice{margin-top:17px;background:#fff7e7;color:#735017;border-radius:14px;padding:12px;font-size:12px;line-height:1.7}
.empty{display:none;text-align:center;padding:30px;color:var(--muted)}
.footer{text-align:center;color:#8798a5;font-size:11px;padding:18px}
.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);align-items:flex-end;z-index:50}
.sheetbox{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px}
.close{width:100%;border:0;border-radius:11px;padding:12px;margin-top:8px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>

</section>

<div class="footer">Doctor to Doctor • Prototype 01 • سبتمبر 2026</div>

let statusFilter='';
function setStatus(s){
 statusFilter=s;
 document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
 if(s==='') document.getElementById('all').classList.add('active');
 if(s==='مناوب الآن') document.getElementById('on').classList.add('active');
 if(s==='متاح') document.getElementById('av').classList.add('active');
 render();
}
function clearAll(){
 q.value=''; hospital.value=''; specialty.value=''; setStatus('');
}
function render(){
 const query=q.value.trim().toLowerCase(), h=hospital.value, s=specialty.value;
 const f=doctors.filter(d=>{
  const hay=(d.name+' '+d.specialty+' '+d.hospital).toLowerCase();
  return (!query||hay.includes(query))&&(!h||d.hospital===h)&&(!s||d.specialty===s)&&(!statusFilter||d.status===statusFilter);
 });
 list.innerHTML=f.map(d=>`
 <article class="card">
  <div class="top">
   <div><div class="name">د. ${d.name}</div><div class="meta">${d.specialty}<br>${d.hospital}</div></div>
   <span class="status ${d.status==='مناوب الآن'?'on':d.status==='متاح'?'avail':'off'}">${d.status}</span>
  </div>
  <div class="actions"><a class="btn call" href="tel:${d.phone}">📞 اتصال</a><button class="btn details" onclick='showDetails(${JSON.stringify(d)})'>التفاصيل</button></div>
 </article>`).join('');
 count.textContent=f.length+' طبيب';
 empty.style.display=f.length?'none':'block';
